name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin media

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/${{ matrix.target }}/release/media dist/package/media
          tar -C dist/package -czf "dist/mediaforge-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" media

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/media.exe" "dist/package/media.exe"
          Compress-Archive -Path "dist/package/media.exe" -DestinationPath "dist/mediaforge-${{ github.ref_name }}-${{ matrix.target }}.zip" -Force

      - name: Publish Unix GitHub Release asset
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mediaforge-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

      - name: Publish Windows GitHub Release asset
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mediaforge-${{ github.ref_name }}-${{ matrix.target }}.zip
