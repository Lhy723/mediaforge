name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin media

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/${{ matrix.target }}/release/media dist/package/media
          tar -C dist/package -czf "dist/mediaforge-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" media

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mediaforge-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
