[package]
name = "mediaforge"
version = "0.1.0"
edition = "2021"
autobins = false
description = "Deterministic, agent-native media processing CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Lhy723/mediaforge"
homepage = "https://github.com/Lhy723/mediaforge"
keywords = ["ffmpeg", "media", "ai-agent", "cli", "automation"]
categories = ["command-line-utilities", "multimedia::video", "multimedia::audio"]

[[bin]]
name = "media"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.14"
